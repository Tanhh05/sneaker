server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sneaker-store-backend
  config:
    import: "optional:classpath:application-local.yml"
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sneaker_store}
    username: ${DB_USERNAME:sneaker_store}
    password: ${DB_PASSWORD:SneakerStore123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:SneakerStoreManagementSystemSecretKey2026ForHS256AuthenticationToken99887766}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
  invoice:
    auto-email-on-issue: ${INVOICE_AUTO_EMAIL:false}
    default-tax-rate: ${INVOICE_DEFAULT_TAX_RATE:8}
    from-email: ${MAIL_FROM:no-reply@adhasneaker.vn}
    store-name: "ADHA SNEAKER STORE"
    store-tax-code: "0319886688"
    store-address: "120 Nguyễn Huệ, Quận 1, TP. Hồ Chí Minh"
    store-hotline: "0901 000 001"

sepay:
  api-key: ${SEPAY_API_KEY:}
  bank-account: ${SEPAY_BANK_ACCOUNT:0346771322}
  account-name: ${SEPAY_ACCOUNT_NAME:ADHA SNEAKER}
  bank-name: ${SEPAY_BANK_NAME:MBBank}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:sneaker-products}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000/sneaker-products}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

