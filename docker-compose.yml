services:
  # -------------------------------------------------------------
  # 1. PostgreSQL 16 Alpine (Lightweight ~100MB RAM, Auto-init DB)
  # -------------------------------------------------------------
  sneaker-postgres:
    image: postgres:16-alpine
    container_name: sneaker-postgres
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=sneaker_store
      - POSTGRES_USER=sneaker_store
      - POSTGRES_PASSWORD=SneakerStore123
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/database/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - sneaker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneaker_store -d sneaker_store"]
      interval: 5s
      timeout: 5s
      retries: 15

  # -------------------------------------------------------------
  # 2. MinIO Object Storage (S3 API: 9000 & Web Console: 9001)
  # -------------------------------------------------------------
  sneaker-minio:
    image: elestio/minio:latest
    container_name: sneaker-minio
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - sneaker-net

  # -------------------------------------------------------------
  # 3. Spring Boot 3 Backend (Java 17, RAM capped for 2GB VPS)
  # -------------------------------------------------------------
  sneaker-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sneaker-backend
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx512m -XX:+UseSerialGC
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://sneaker-postgres:5432/sneaker_store
      - DB_USERNAME=sneaker_store
      - DB_PASSWORD=SneakerStore123
      - MINIO_ENDPOINT=http://sneaker-minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=sneaker-products
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000/sneaker-products}
      - SEPAY_BANK_ACCOUNT=0346771322
      - SEPAY_ACCOUNT_NAME=ADHA SNEAKER
      - SEPAY_BANK_NAME=MBBank
    networks:
      - sneaker-net
    depends_on:
      sneaker-postgres:
        condition: service_healthy
      sneaker-minio:
        condition: service_started

  # -------------------------------------------------------------
  # 4. Vue 3 Frontend (Nginx Reverse Proxy)
  # -------------------------------------------------------------
  sneaker-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sneaker-frontend
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "5173:80"
      - "80:80"
    networks:
      - sneaker-net
    depends_on:
      - sneaker-backend

volumes:
  postgres-data:
    name: sneaker-postgres-data
  minio-data:
    name: sneaker-minio-data

networks:
  sneaker-net:
    name: sneaker-net
    driver: bridge
