server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Reverse proxy for MinIO product/review images (uses ^~ to beat static image regex)
    location ^~ /sneaker-products/ {
        proxy_pass http://sneaker-minio:9000/sneaker-products/;
        proxy_http_version 1.1;
        proxy_set_header Host sneaker-minio:9000;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Reverse proxy for backend APIs (uses ^~ so /api/files/view/*.png isn't caught by static regex)
    location ^~ /api/ {
        proxy_pass http://sneaker-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Swagger / OpenAPI documentation
    location /swagger-ui/ {
        proxy_pass http://sneaker-backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://sneaker-backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # Vue Router SPA history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
